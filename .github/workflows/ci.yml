name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all workspaces
        run: npm run typecheck --workspaces --if-present

      - name: Run tests
        run: npm run test --workspaces --if-present

      - name: Production build (web)
        # Build gate: if `next build` fails, the deploy in Phase 9 must not run.
        # NEXT_PUBLIC_* values are build-time placeholders; public pages are
        # statically generated and make no network calls during the build.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build --workspace=@portfolio/web
